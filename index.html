<style>
*{box-sizing:border-box}
:root{
  color-scheme: light;
  padding-top:env(safe-area-inset-top,0px);
  --yellow:#ffd84d;
  --yellow-deep:#ffc21a;
  --ink:#2b1a0e;
  --tomato:#ff5a36;
  --cream:#fffaf0;
  --mint:#2ec4a6;
  --muted:#6b5a44;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sticker:0 5px 0 var(--ink);
}
html,body{height:100%}
body{
  margin:0;overflow-x:hidden;
  background-color:var(--yellow);
  background-image:radial-gradient(rgba(255,255,255,.55) 2px, transparent 2.5px);
  background-size:26px 26px;
  color:var(--ink);font-family:var(--body);font-size:15px;
}
img{max-width:100%}
[hidden]{display:none!important}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 112px;display:flex;flex-direction:column;gap:14px}
button{font-family:var(--display)}
button:focus-visible,a:focus-visible{outline:3px solid var(--tomato);outline-offset:3px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:20px var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.brand i{font-style:normal;background:var(--tomato);color:#fff;border-radius:8px;padding:1px 7px;font-size:13px;border:2px solid var(--ink)}
.chip{appearance:none;cursor:pointer;border:2.5px solid var(--ink);background:#fff;color:var(--ink);font:15px var(--display);padding:7px 13px;border-radius:999px;box-shadow:0 3px 0 var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chip svg{width:16px;height:16px}
.flags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:7px 8px;background:#fff;border:2.5px solid var(--ink);border-radius:14px}
.flag{display:block;height:18px;width:auto;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.flag.np{height:21px;box-shadow:none}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:132px 1fr;align-items:end;gap:6px;min-height:150px}
.hero svg.char{width:132px;height:auto;display:block;margin-bottom:-6px}
.bubble{position:relative;align-self:center;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:12px 14px;box-shadow:var(--sticker)}
.bubble::before{content:"";position:absolute;left:-14px;bottom:22px;border:9px solid transparent;border-right:14px solid var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-8px;bottom:25px;border:6px solid transparent;border-right:10px solid #fff;border-left:0}
.bubble h1{margin:0;font:400 clamp(30px,9vw,40px)/1 var(--display);color:var(--tomato);-webkit-text-stroke:0;text-shadow:2px 2px 0 var(--ink);letter-spacing:-.01em;text-wrap:balance}
.bubble p{margin:6px 0 0;font:15px/1.35 var(--display);color:var(--ink)}

/* game */
.game{background:var(--cream);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:18px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.label{font:17px var(--display);background:var(--ink);color:var(--yellow);padding:4px 14px;border-radius:999px}
.slot{position:relative;width:170px;height:170px;border-radius:32px;background:#fff;border:4px solid var(--ink);box-shadow:inset 0 -10px 0 rgba(43,26,14,.08),0 6px 0 var(--ink);display:grid;place-items:center;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.slot::before,.slot::after{content:"";position:absolute;left:0;right:0;height:26px;pointer-events:none}
.slot::before{top:0;background:linear-gradient(#fff,rgba(255,255,255,0))}
.slot::after{bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff)}
.num{font:400 120px/1 var(--display);color:var(--tomato);text-shadow:4px 4px 0 var(--ink);font-variant-numeric:tabular-nums}
.num.q{color:var(--yellow-deep)}
.num.flip{animation:flip .09s linear}
@keyframes flip{from{transform:translateY(-40%);opacity:.3}to{transform:none;opacity:1}}
.num.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.slot.spin{animation:wob .12s linear infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.pips{display:flex;gap:6px}
.pips span{width:12px;height:12px;border-radius:50%;background:#e9dcc3;border:2px solid var(--ink)}
.pips span.on{background:var(--tomato)}
.msg{min-height:48px;text-align:center;font:19px/1.3 var(--display);text-wrap:balance}
.msg small{display:block;font:14px var(--body);color:var(--muted);margin-top:2px}

.big-btn{appearance:none;cursor:pointer;width:100%;border:3px solid var(--ink);border-radius:20px;padding:16px 16px;font:24px var(--display);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.big-btn:disabled{filter:saturate(.4);opacity:.75;cursor:default}
.big-btn svg{width:30px;height:30px;flex:none}
.shake{background:var(--tomato);color:#fff;padding-block:20px;font-size:27px;text-shadow:1px 1px 0 var(--ink)}
.shake small{display:block;font:14px var(--body);text-shadow:none;opacity:.95}
.shake.on{background:var(--mint);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.shake .tx{text-align:left;line-height:1.15}
.tap{background:#fff;color:var(--ink)}
.hint{margin:0;font-size:13.5px;color:var(--muted);text-align:center;line-height:1.5}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px 4px;text-align:center;box-shadow:0 3px 0 var(--ink)}
.stat b{display:block;font:26px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.hi{background:var(--tomato);color:#fff}
.stat.hi span{color:#fff}
.history{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:34px;align-items:center}
.history i{font-style:normal;font:17px var(--display);width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#fff;border:2.5px solid var(--ink)}
.history i:first-child{background:var(--tomato);color:#fff}
.history .empty{font-size:13px;color:var(--muted)}

.install{appearance:none;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:18px;background:#fff;border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.install .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--yellow);border:2.5px solid var(--ink);display:grid;place-items:center}
.install .ic svg{width:22px;height:22px}
.install b{display:block;font:18px var(--display)}
.install small{display:block;font:13px var(--body);color:var(--muted)}

/* footbar */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff}
.foot-in{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dev{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;min-width:0}
.coin{flex:none;width:42px;height:42px;border-radius:50%;background:var(--yellow);border:2.5px solid #fff;display:grid;place-items:center}
.coin svg{width:20px;height:20px}
.dev small{display:block;font:12px var(--body);color:#ffe9a8;word-break:keep-all;line-height:1.3}
.dev strong{display:block;font:21px var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums;user-select:all}
.foot .chip{box-shadow:none;border-color:#fff}

#fx{position:fixed;inset:0;pointer-events:none;z-index:4;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#fff;color:var(--ink);border:2.5px solid var(--ink);font:15px var(--display);padding:8px 16px;border-radius:999px;z-index:6;white-space:nowrap}
.sheet-bg{position:fixed;inset:0;z-index:10;background:rgba(43,26,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));background:var(--cream);border-top:3px solid var(--ink);border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font:24px var(--display)}
.sheet ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;line-height:1.55;font-size:16px}
.sheet .go{display:block;text-align:center;text-decoration:none;font:20px var(--display);color:#fff;background:var(--tomato);border:3px solid var(--ink);padding:13px;border-radius:999px;box-shadow:0 4px 0 var(--ink)}
.sheet .chip{align-self:center}

@media (prefers-reduced-motion: reduce){.slot.spin,.num.flip,.num.pop,.shake.on{animation:none}}
</style>
</head>

    <g fill="#fff"><circle cx="8" cy="22.5" r="2.4"/><path d="M8 18.4l.7 1.6 1.6-.9-.3 1.8 1.8.3-1.3 1.3 1.3 1.3-1.8.3.3 1.8-1.6-.9L8 26.6l-.7-1.6-1.6.9.3-1.8-1.8-.3 1.3-1.3-1.3-1.3 1.8-.3-.3-1.8 1.6.9z"/></g></svg><svg class="flag" role="img" aria-label="태국" viewBox="0 0 60 40"><rect width="60" height="40" fill="#a51931"/><rect y="6.67" width="60" height="26.67" fill="#f4f5f8"/><rect y="13.33" width="60" height="13.33" fill="#2d2a4a"/></svg><svg class="flag" role="img" aria-label="베트남" viewBox="0 0 60 40"><rect width="60" height="40" fill="#da251d"/><polygon points="30.00,8.00 32.68,16.31 41.41,16.29 34.34,21.41 37.05,29.71 30.00,24.56 22.95,29.71 25.66,21.41 18.59,16.29 27.32,16.31" fill="#ffcd00"/></svg><svg class="flag" role="img" aria-label="캄보디아" viewBox="0 0 60 40"><rect width="60" height="40" fill="#032ea1"/><rect y="10" width="60" height="20" fill="#e00025"/>
    <path fill="#fff" d="M16 27h28v-2h-2v-3h-2v-3l-1-1v-3l-1-2-1 2v3l-1 1v2h-2v-3l-1-1v-4l-1-3-1 3v4l-1 1v3h-2v-2l-1-1v-3l-1-2-1 2v3l-1 1v3h-2v3h-2z"/></svg></div>

  <section class="game" aria-label="행운 번호 뽑기">
    <div class="label">오늘의 행운 번호</div>

    <div class="pips" id="pips" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="msg" id="msg" aria-live="polite">1부터 6 중에 하나!<small>3초 뒤에 번호가 정해져</small></div>
    <button class="big-btn shake" id="motionBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4 8v8M20 8v8M1.5 10v4M22.5 10v4"/></svg>
      <span class="tx"><span id="motionTxt">흔들기 모드 켜기</span><small id="motionSub">한 번 켜두면 폰만 흔들어도 뽑혀</small></span>
    </button>

      눌러서 뽑기
    </button>
    <p class="hint" id="hint">흔들기가 안 되면 버튼이나 숫자 칸을 눌러도 돼.</p>
  </section>

  <div class="stats">
    <div class="stat hi"><b id="sUsers">–</b><span>총 이용자 수</span></div>
    <div class="stat"><b id="sMine">0</b><span>내 뽑기</span></div>
    <div class="stat"><b id="sRolls">–</b><span>전체 뽑기</span></div>
  </div>
  <div class="history" id="history" aria-label="최근 번호"><span class="empty">최근 뽑은 번호가 여기 쌓여</span></div>

  <button class="install" id="installBtn" type="button">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#2b1a0e" stroke-width="2.4" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg></span>
    <span><b>홈 화면에 앱으로 저장</b><small>다음부턴 아이콘 한 번에 바로 열려</small></span>
  </button>

      <span style="min-width:0"><small>가게 게임앱 · 체험단 · 광고 문의</small><strong>010-5198-1500</strong></span>

    <h2 id="sheetTitle">홈 화면에 저장하기</h2>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  const ROLL_MS=3000, VOLUME=0.83;
  const MSGS={
    1:['1번! 오늘은 가볍게 김밥 한 줄 🍙','소소하게 시작하는 날'],
    2:['2번! 둘이 먹다 하나 없어져도 모를 맛 😋','같이 갈 사람 부르기'],
    3:['3번! 삼겹살 굽기 딱 좋은 날 🥓','지글지글 각이다'],
    4:['4번! 치킨 반반 무많이 🍗','오늘 저녁 정해짐'],
    5:['5번! 따끈한 국물이 당기는 날 🍜','라멘? 쌀국수? 짬뽕?'],
    6:['6번! 대박, 오늘 운 좋은 날 🎉','맛집의신이 함께해']
  };
  let rolling=false, soundOn=true, mine=0, history=[];
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  mine=parseInt(lsGet('ld_mine')||'0',10)||0; $('sMine').textContent=mine;

  // ---------- audio ----------
  let ac=null, master=null;
  function audio(){try{
    if(!ac){const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      ac=new AC(); const comp=ac.createDynamicsCompressor(); comp.threshold.value=-10; comp.ratio.value=4;
      master=ac.createGain(); master.gain.value=VOLUME; master.connect(comp); comp.connect(ac.destination);}
    if(ac.state==='suspended'){const p=ac.resume(); if(p&&p.catch)p.catch(()=>{})}
    return ac;}catch(e){return null}}
  function tone(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function blip(n){if(!soundOn||!audio())return; tone(hz(72+n*2),ac.currentTime,.06,'square',.06)}
  function playBgm(){
    if(!soundOn||!audio())return;
    const t0=ac.currentTime+.03, step=.125, steps=Math.floor(ROLL_MS/1000/step);
    const bars=[[60,64,67,72],[65,69,72,77],[67,71,74,79]], seq=[0,1,2,3,2,1,2,3];
    for(let i=0;i<steps;i++){const bar=bars[Math.min(2,Math.floor(i/8))],t=t0+i*step;
      if(i%4===0) tone(hz(bar[0]-24),t,.22,'triangle',.22);
      if(i%2===1) tone(hz(bar[seq[i%8]]),t,.08,'triangle',.05);}
  }
  function playWin(big){
    if(!soundOn||!audio())return; const t=ac.currentTime+.02;
    [72,76,79,84].forEach((m,i)=>tone(hz(m),t+i*.08,.3,'square',.06));
    tone(hz(88),t+.34,.8,'sine',.14);
    if(big)[84,88,91,96].forEach((m,i)=>tone(hz(m),t+.6+i*.07,.3,'triangle',.09));
  }
  $('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundTxt').textContent=soundOn?'소리 ON':'소리 OFF';$('wave').style.opacity=soundOn?1:.15;$('soundBtn').setAttribute('aria-pressed',soundOn);if(soundOn)audio()};

  // ---------- confetti ----------
  const fx=$('fx'),ctx=fx.getContext('2d');let parts=[],raf=0;
  function sizeFx(){const r=window.devicePixelRatio||1;fx.width=innerWidth*r;fx.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0)}
  sizeFx();addEventListener('resize',sizeFx);
  function burst(n){if(reduce)return;const b=$('slot').getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
    const cols=['#ff5a36','#2ec4a6','#ffffff','#2b1a0e','#ff8f8f','#ffc21a'];
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*7;parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,s:5+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:70+Math.random()*40})}
    if(!raf)raf=requestAnimationFrame(tick)}
  function tick(){ctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);
    parts.forEach(p=>{p.vy+=.22;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;ctx.save();ctx.globalAlpha=Math.min(1,p.life/30);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    raf=parts.length?requestAnimationFrame(tick):0;if(!raf)ctx.clearRect(0,0,innerWidth,innerHeight)}

  // ---------- roll: numbers race, slow down, land at 3s ----------
  const num=$('num'), pips=[...$('pips').children];
  function show(n,cls){num.textContent=n;num.classList.remove('q','flip','pop');void num.offsetWidth;if(cls)num.classList.add(cls);
    pips.forEach((p,i)=>p.classList.toggle('on',i<n))}
  function roll(){
    if(rolling)return; rolling=true; $('rollBtn').disabled=true;
    try{playBgm()}catch(e){}
    const result=1+Math.floor(Math.random()*6);
    $('slot').classList.add('spin'); $('msg').innerHTML='두구두구두구…<small>번호 고르는 중</small>';
    const start=performance.now(); let last=0;
    (function step(){
      const t=performance.now()-start;
      if(t>=ROLL_MS){finish(result);return}
      const gap=50+Math.pow(t/ROLL_MS,2.2)*300; // speeds from fast to slow
      if(t-last>=gap){last=t;let n;do{n=1+Math.floor(Math.random()*6)}while(n==num.textContent);show(n,'flip');try{blip(n)}catch(e){}}
      requestAnimationFrame(step);
    })();
  }
  function finish(n){
    $('slot').classList.remove('spin'); show(n,'pop');
    $('msg').innerHTML=MSGS[n][0]+'<small>'+MSGS[n][1]+'</small>';
    try{playWin(n===6)}catch(e){} burst(n===6?90:34);
    history.unshift(n);history=history.slice(0,8);$('history').innerHTML=history.map(h=>'<i>'+h+'</i>').join('');
    mine++;lsSet('ld_mine',String(mine));$('sMine').textContent=mine;
    rolling=false;$('rollBtn').disabled=false; saveVisit();
  }
  $('rollBtn').onclick=()=>{audio();roll()};
  $('slot').addEventListener('click',()=>{audio();roll()});
  $('slot').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();roll()}});

  // ---------- shake ----------
  let lastShake=0,motionOn=false,prev=null;
  function onMotion(e){const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;
    const cur={x:a.x||0,y:a.y||0,z:a.z||0};
    if(prev){const d=Math.abs(cur.x-prev.x)+Math.abs(cur.y-prev.y)+Math.abs(cur.z-prev.z),now=Date.now();
      if(d>22&&now-lastShake>1200&&!rolling){lastShake=now;roll()}}
    prev=cur}
  function motionReady(){$('motionBtn').classList.add('on');$('motionTxt').textContent='흔들기 ON!';$('motionSub').textContent='지금 폰을 세게 한 번 흔들어봐'}
  async function enableMotion(){
    audio();
    try{
      if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
        const r=await DeviceMotionEvent.requestPermission(); if(r!=='granted')throw 0}
      if(!motionOn){addEventListener('devicemotion',onMotion);motionOn=true}
      motionReady();
    }catch(e){$('motionTxt').textContent='흔들기 사용 불가';$('motionSub').textContent='아래 버튼을 눌러서 뽑아줘'}
  }
  $('motionBtn').onclick=enableMotion;
  if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission!=='function'){addEventListener('devicemotion',onMotion);motionOn=true}

  // ---------- copy ----------
  function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1600)}
  $('copyBtn').onclick=()=>{const n='010-5198-1500';try{navigator.clipboard.writeText(n).then(()=>toast('번호 복사됨: '+n),()=>toast(n))}catch(e){toast(n)}};

  // ---------- shared counter (same keys as before, so counts continue) ----------
  const API='https://countapi.mileshilliard.com/api/v1/', K_USERS='eyecoler-luckydice-users', K_ROLLS='eyecoler-luckydice-rolls';
  const fmt=n=>Number(n).toLocaleString('ko-KR');
  async function hit(k){const r=await fetch(API+'hit/'+k,{cache:'no-store'});if(!r.ok)throw 0;return(await r.json()).value}
  async function getv(k){const r=await fetch(API+'get/'+k,{cache:'no-store'});if(r.status===404)return 0;if(!r.ok)throw 0;return(await r.json()).value}
  (async()=>{
    try{const c=lsGet('ld_counted');const u=c?await getv(K_USERS):await hit(K_USERS);if(!c)lsSet('ld_counted','1');$('sUsers').textContent=fmt(u)}catch(e){}
    try{$('sRolls').textContent=fmt(await getv(K_ROLLS))}catch(e){}
  })();
  function saveVisit(){hit(K_ROLLS).then(v=>{$('sRolls').textContent=fmt(v)}).catch(()=>{})}

  // ---------- install (PWA) ----------
  const ua=navigator.userAgent||'';
  const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isAndroid=/Android/i.test(ua);
  const inApp=/KAKAOTALK|Instagram|FBAN|FBAV|Line\/|NAVER|DaumApps|everytimeApp/i.test(ua);
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  let deferred=null; if(standalone)$('installBtn').hidden=true;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
  addEventListener('appinstalled',()=>{$('installBtn').hidden=true;toast('홈 화면에 저장됐어!')});
  const here=location.href.split('#')[0];
  function sheet(h){$('sheetBody').innerHTML=h;$('sheetBg').hidden=false}
  $('sheetClose').onclick=()=>{$('sheetBg').hidden=true};
  $('sheetBg').addEventListener('click',e=>{if(e.target===$('sheetBg'))$('sheetBg').hidden=true});
  $('installBtn').onclick=async()=>{
    if(deferred){deferred.prompt();try{const c=await deferred.userChoice;if(c&&c.outcome==='accepted')$('installBtn').hidden=true}catch(e){}deferred=null;return}
    if(inApp){const ext=isAndroid?'intent://'+here.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end':'kakaotalk://web/openExternal?url='+encodeURIComponent(here);
      sheet(`<ol><li>지금은 <b>카톡 같은 앱 안의 브라우저</b>라서 바로 저장이 안 돼.</li><li>아래 버튼으로 <b>${isAndroid?'크롬':'사파리'}</b>에서 열고, 이 버튼을 다시 눌러줘.</li></ol><a class="go" href="${ext}">${isAndroid?'크롬으로':'사파리로'} 열기</a>`);return}
    if(isIOS){sheet(`<ol><li>화면 아래 <b>공유 버튼</b> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff5a36" stroke-width="2.4" style="vertical-align:-2px"><path d="M12 3v12M8 7l4-4 4 4M5 12v8h14v-8"/></svg> 누르기</li><li>메뉴를 올려서 <b>‘홈 화면에 추가’</b> 누르기</li><li>오른쪽 위 <b>추가</b> 누르면 끝</li></ol>`);return}
    sheet(`<ol><li>브라우저 오른쪽 위 <b>⋮ 메뉴</b> 누르기</li><li><b>‘앱 설치’</b> 또는 <b>‘홈 화면에 추가’</b> 누르기</li></ol>`);
  };
  if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
